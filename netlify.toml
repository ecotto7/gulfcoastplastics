[build]
  command = ""
  publish = "."

# Security headers apply to every response, including 404.html.
# Content-Security-Policy-Report-Only does not block anything.
# style-src allows 'unsafe-inline' because the Contact Us page copies the
# live JotForm wrapper style, and the JotForm loader sets iframe styles.
# script-src, frame-src, and connect-src allow the JotForm hosts the embed uses.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000"
    Content-Security-Policy-Report-Only = "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' https://form.jotform.com https://*.jotform.com https://*.jotfor.ms; style-src 'self' 'unsafe-inline' https://form.jotform.com https://*.jotfor.ms; img-src 'self' data: https://form.jotform.com https://*.jotform.com https://*.jotfor.ms https://files.jotform.com; font-src 'self' data:; frame-src https://form.jotform.com https://*.jotform.com; connect-src 'self' https://form.jotform.com https://*.jotform.com https://*.jotfor.ms https://submit.jotform.com https://events.jotform.com; form-action 'self' https://submit.jotform.com https://form.jotform.com https://*.jotform.com"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Do not redirect /?p=5 or /?page_id=5. Both already land on the homepage.
# Netlify forwards the query string, so sending those to / would loop.
[[redirects]]
  from = "/index.php"
  to = "/"
  status = 301

